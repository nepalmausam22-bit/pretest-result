<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pretest Result Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h2 { color: #333; margin-bottom: 20px; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
            transition: 0.3s;
        }
        button:hover { background-color: #27ae60; }
        #resultDisplay {
            margin-top: 25px;
            padding: 15px;
            border-radius: 5px;
            font-weight: bold;
            display: none;
        }
        .pass { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .fail { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .notfound { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    </style>
</head>
<body>

<div class="container">
    <h2>Pretest Result</h2>
    <p>Please enter your Roll Number below:</p>
    <input type="text" id="rollNumberInput" placeholder="e.g. 101">
    <button onclick="checkResult()">Check Result</button>
    
    <div id="resultDisplay"></div>
</div>

<script>
    const resultData = {
        "101": { name: "Ram Thapa", status: "PASSED", marks: 78 },
        "102": { name: "Sita Shrestha", status: "PASSED", marks: 85 },
        "103": { name: "Hari Sharma", status: "FAILED", marks: 32 },
        "104": { name: "Gita Rai", status: "PASSED", marks: 60 }
    };

    function checkResult() {
        const rollInput = document.getElementById("rollNumberInput").value.trim();
        const display = document.getElementById("resultDisplay");
        
        display.style.display = "block";
        
        if (rollInput === "") {
            display.className = "notfound";
            display.innerHTML = "Please enter a roll number.";
            return;
        }
        
        if (resultData[rollInput]) {
            const student = resultData[rollInput];
            if (student.status === "PASSED") {
                display.className = "pass";
                display.innerHTML = `🎉 Congratulations ${student.name}!<br>Status: ${student.status}<br>Marks: ${student.marks}`;
            } else {
                display.className = "fail";
                display.innerHTML = `😞 Sorry ${student.name}.<br>Status: ${student.status}<br>Marks: ${student.marks}`;
            }
        } else {
            display.className = "notfound";
            display.innerHTML = "Roll number not found. Please try again.";
        }
    }
</script>

</body>
</html>
