<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>लोक सेवा आयोग - प्रिटेष्ट नतिजा</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 450px;
        }
        h2 { color: #d63031; margin: 5px 0; }
        h3 { color: #0984e3; margin: 5px 0 20px 0; font-size: 16px; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 2px solid #b2bec3;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
            text-align: center;
        }
        button {
            background-color: #0984e3;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
            font-weight: bold;
        }
        button:hover { background-color: #074b83; }
        #resultDisplay {
            margin-top: 25px;
            padding: 15px;
            border-radius: 5px;
            display: none;
            font-weight: bold;
            line-height: 1.6;
        }
        .pass { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .notfound { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    </style>
</head>
<body>

<div class="container">
    <h2>लोक सेवा आयोग</h2>
    <h3>लिखित परीक्षा नतिजा प्रकाशन (पूर्व-योग्यता)</h3>
    <p>जम्मा छनौट संख्या: <strong>१८,२१६ जना</strong></p>
    
    <p>कृपया आफ्नो रोल नम्बर (Roll Number) राख्नुहोस्:</p>
    <input type="text" id="rollNumberInput" placeholder="जस्तै: 10003 वा 50426">
    <button onclick="checkResult()">नतिजा हेर्नुहोस्</button>
    
    <div id="resultDisplay"></div>
</div>

<script>
    function checkResult() {
        const rollInput = document.getElementById("rollNumberInput").value.trim();
        const display = document.getElementById("resultDisplay");
        
        display.style.display = "block";
        const roll = parseInt(rollInput, 10);
        
        if (rollInput === "" || isNaN(roll)) {
            display.className = "notfound";
            display.innerHTML = "कृपया मान्य रोल नम्बर राख्नुहोस्।";
            return;
        }
        
        // लोकसेवाको सूचीमा भएका रोल नम्बर रेन्ज (Range Check Logic)
        const isPassed = (
            (roll >= 10003 && roll <= 11938) || 
            (roll >= 50003 && roll <= 53312)
        );
        
        if (isPassed) {
            display.className = "pass";
            display.innerHTML = `
                🎉 बधाई छ! रोल नम्बर ${rollInput} उत्तीर्ण सूचीमा समावेश छ।<br>
                <span style="color:#2ecc71;">Status: SELECTED FOR SECOND STAGE</span><br><br>
                <small style="font-weight:normal; color:#555;">
                आफ्नो नाम र थप विवरण रुजु गर्न आधिकारिक पीडीएफको पाना जाँच गर्नुहोला।
                </small>
            `;
        } else {
            display.className = "notfound";
            display.innerHTML = "खोजिएको रोल नम्बर उत्तीर्ण भएका १८,२१६ जनाको सूचीमा भेटिएन।";
        }
    }
</script>

</body>
</html>
